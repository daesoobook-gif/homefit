<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="홈핏"><meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>홈핏</title>
<style>
  /* A 깔끔한 프리미엄 — 밝은 화면(기본) + 어두운 화면(폰 설정 따라감). 강조색 하나(파랑), 초록=성공, 빨강=실패 */
  :root {
    --bg:#f2f4f7; --card:#ffffff; --card2:#f2f4f7; --line:#e4e7ec; --text:#191f28; --dim:#5b6573;
    --acc:#1b64f2; --acc-ink:#ffffff; --acc-soft:rgba(27,100,242,.09); --acc-line:rgba(27,100,242,.35);
    --ok:#12805c; --ok-bg:#12805c; --ok-ink:#ffffff; --ok-soft:rgba(22,163,111,.12);
    --bad:#d92d3a; --bad-bg:#e5484d; --bad-ink:#ffffff; --bad-soft:rgba(229,72,77,.10);
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
    --shadow-hi:0 12px 32px rgba(16,24,40,.16);
    --nav-bg:rgba(255,255,255,.86); --part:#667085; --blue:var(--acc);
    --f-num:"Manrope", "Noto Sans KR", -apple-system, "Apple SD Gothic Neo", system-ui, sans-serif;
    --f-body:"Noto Sans KR", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Gothic A1", sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark) {
    :root {
      --bg:#0e1116; --card:#171b22; --card2:#202632; --line:#262d39; --text:#f3f5f8; --dim:#9aa4b2;
      --acc:#5b9bff; --acc-ink:#071226; --acc-soft:rgba(91,155,255,.14); --acc-line:rgba(91,155,255,.45);
      --ok:#4cd39a; --ok-bg:#2ec58b; --ok-ink:#04170f; --ok-soft:rgba(46,197,139,.14);
      --bad:#ff7b80; --bad-bg:#f0555b; --bad-ink:#2a0608; --bad-soft:rgba(240,85,91,.14);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.28);
      --shadow-hi:0 14px 36px rgba(0,0,0,.55);
      --nav-bg:rgba(14,17,22,.86); --part:#6b7686;
      color-scheme:dark;
    }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x:clip; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.6 var(--f-body); word-break:keep-all; overflow-wrap:anywhere;
         -webkit-font-smoothing:antialiased; padding-bottom:calc(104px + env(safe-area-inset-bottom, 0px)); }
  button:focus-visible, input:focus-visible, summary:focus-visible, textarea:focus-visible { outline:3px solid var(--acc); outline-offset:2px; }

  header { max-width:560px; margin:0 auto; padding:20px 20px 12px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:baseline; gap:10px; }
  .brand .logo { font:800 28px/1 var(--f-num); letter-spacing:-.5px; color:var(--text); }
  .brand .logo b { color:var(--acc); font-weight:800; }
  .brand .sub { font-size:13px; color:var(--dim); font-weight:500; }
  #status { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { display:inline-flex; align-items:center; min-height:32px; padding:4px 12px; border-radius:99px; font-size:13px; font-weight:500; background:var(--card); color:var(--dim); border:1px solid var(--line); }
  .chip.on { color:var(--ok); background:var(--ok-soft); border-color:transparent; }
  .chip.off { color:var(--acc); background:var(--acc-soft); border-color:transparent; }
  .chip.na { color:var(--bad); background:var(--bad-soft); border-color:transparent; }

  main { max-width:560px; margin:0 auto; padding:0 20px; display:flex; flex-direction:column; gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:24px; padding:22px; box-shadow:var(--shadow); }
  .card > * + * { margin-top:10px; }
  .card.warn { background:linear-gradient(var(--acc-soft), var(--acc-soft)), var(--card); border-color:var(--acc-line); }
  .card.danger { background:linear-gradient(var(--bad-soft), var(--bad-soft)), var(--card); border-color:rgba(229,72,77,.4); }
  .card.good { background:linear-gradient(var(--ok-soft), var(--ok-soft)), var(--card); border-color:rgba(22,163,111,.4); }
  h2 { margin:0 0 6px; font-size:19px; font-weight:700; letter-spacing:-.3px; text-wrap:balance; }
  p { margin:6px 0; }
  .dim { color:var(--dim); font-size:14px; line-height:1.65; }
  .badge { display:inline-block; padding:1px 11px; border-radius:99px; background:var(--acc); color:var(--acc-ink); font:700 14px/1.7 var(--f-num); vertical-align:2px; }
  .tag { display:inline-block; padding:0 9px; border-radius:99px; background:var(--card2); color:var(--dim); font:600 12px/1.9 var(--f-num); margin-left:6px; vertical-align:3px; }
  .ok-t { color:var(--ok); } .bad-t { color:var(--bad); } .acc-t { color:var(--acc); } .live-t { color:var(--acc); }

  button { font:500 16px/1.2 var(--f-body); color:var(--text); background:var(--card2); border:0; border-radius:16px; min-height:50px; padding:0 18px; cursor:pointer; transition:transform .12s ease, filter .15s, background .15s; }
  button:active { transform:scale(.97); filter:brightness(.94); }
  button.primary { background:var(--acc); color:var(--acc-ink); width:100%; font-weight:700; font-size:18px; min-height:60px; border-radius:18px; box-shadow:0 8px 20px -6px var(--acc-line); }
  button.warnb { background:var(--acc); color:var(--acc-ink); font-weight:700; }
  button.dangerb { background:var(--bad-soft); color:var(--bad); font-weight:700; }
  button.small { min-height:42px; font-size:14px; padding:0 14px; border-radius:13px; }
  button:disabled { opacity:.4; cursor:not-allowed; transform:none; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; } .row.between { justify-content:space-between; }
  .choice { display:block; width:100%; text-align:left; padding:16px 18px; min-height:76px; font-size:18px; font-weight:700; background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:20px; }
  .choice span { font-size:14px; color:var(--dim); font-weight:400; }
  .back { min-height:40px; font-size:14px; padding:0 14px; align-self:flex-start; background:transparent; color:var(--dim); }

  .card.cur { padding:26px 22px 22px; }
  .cur .lift { font-size:20px; font-weight:700; letter-spacing:-.3px; }
  .cur .w { font:800 min(96px, 24vw)/1 var(--f-num); white-space:nowrap; letter-spacing:-.04em; font-variant-numeric:tabular-nums; margin-top:6px; }
  .cur .w small { font:600 26px/1 var(--f-num); color:var(--dim); margin-left:6px; letter-spacing:0; }
  .dots { display:flex; gap:8px; margin:18px 0; }
  .dot { flex:1; height:42px; border-radius:14px; border:0; background:var(--card2); display:flex; align-items:center; justify-content:center; font:700 17px/1 var(--f-num); color:var(--dim); }
  .dot.now { background:var(--acc-soft); color:var(--acc); box-shadow:inset 0 0 0 2px var(--acc); }
  .dot.ok { background:var(--ok-bg); color:var(--ok-ink); } .dot.fail { background:var(--bad-bg); color:var(--bad-ink); }
  .big2 { display:flex; gap:10px; }
  .big2 button { min-height:92px; font-size:21px; font-weight:700; border-radius:22px; }
  .big2 .done { flex:2; background:var(--ok-bg); color:var(--ok-ink); box-shadow:0 10px 22px -8px var(--ok-bg); }
  .big2 .fail { flex:1; background:var(--bad-soft); color:var(--bad); }
  .mini { display:inline-flex; gap:3px; vertical-align:middle; }
  .mini i { width:10px; height:10px; border-radius:50%; border:1.5px solid var(--line); display:inline-block; }
  .mini i.ok { background:var(--ok-bg); border-color:var(--ok-bg); } .mini i.fail { background:var(--bad-bg); border-color:var(--bad-bg); }
  .mini i.none { background:transparent; border-style:dashed; }

  .rest { position:sticky; top:env(safe-area-inset-top, 0px); z-index:4; background:var(--card); border:1px solid var(--acc-line); border-radius:28px; padding:20px; text-align:center; box-shadow:var(--shadow-hi); }
  .rest .gauge { position:relative; width:150px; height:150px; margin:0 auto; }
  .rest svg { width:150px; height:150px; transform:rotate(-90deg); }
  .rest svg circle:first-child { stroke:var(--card2); }
  .rest #restArc { stroke:var(--acc); stroke-linecap:round; transition:stroke-dashoffset .25s linear; }
  .rest .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:800 40px/1 var(--f-num); letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
  .rest .msg { font-size:15px; color:var(--dim); margin:10px 0 14px; }
  .rest button { width:100%; min-height:54px; font-size:16px; font-weight:700; }
  .rest.done { border-color:var(--ok-bg); animation:pulse 1s ease-in-out 6; }
  .rest.done #restArc { stroke:var(--ok-bg); }
  .rest.done .num { font-size:30px; color:var(--ok); }
  .rest.done button { background:var(--ok-bg); color:var(--ok-ink); }
  @keyframes pulse { 50% { box-shadow:0 0 0 7px var(--ok-soft), var(--shadow-hi); } }

  nav { position:fixed; bottom:0; left:0; right:0; z-index:5; display:flex; justify-content:center; gap:6px;
        padding:8px 20px calc(8px + env(safe-area-inset-bottom, 0px)); background:var(--nav-bg); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); border-top:1px solid var(--line); }
  nav button { flex:1; max-width:264px; min-height:56px; border-radius:18px; background:transparent; color:var(--dim); font-size:12.5px; font-weight:500;
               display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:0; }
  nav button svg { width:24px; height:24px; }
  nav button.on { color:var(--acc); background:var(--acc-soft); font-weight:700; }

  .cal { display:grid; grid-template-columns:repeat(7, minmax(0, 1fr)); gap:6px; margin-top:14px; }
  .cal .h { text-align:center; font-size:12px; color:var(--dim); padding-bottom:4px; font-weight:500; }
  .cal .h:first-child { color:var(--bad); }
  .cal button { min-height:54px; padding:7px 0 4px; border-radius:16px; background:transparent; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:3px; font:600 16px/1 var(--f-num); }
  .cal button.today { background:var(--acc); color:var(--acc-ink); }
  .cal button.sel { box-shadow:inset 0 0 0 2px var(--text); }
  .cal button.today.sel { box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--acc); }
  .cal .mk { min-width:22px; padding:2px 5px; border-radius:99px; font:700 11px/1.1 var(--f-num); color:#fff; }
  .cal .mk.ok { background:var(--ok-bg); color:var(--ok-ink); } .cal .mk.fail { background:var(--bad-bg); color:var(--bad-ink); } .cal .mk.part { background:var(--part); color:#fff; }
  .cal .mk.live { background:transparent; color:var(--acc); font-size:14px; line-height:1; }
  .cal button.today .mk.live { color:var(--acc-ink); }
  .cal button.today .mk.ok, .cal button.today .mk.fail, .cal button.today .mk.part { box-shadow:0 0 0 1.5px var(--acc-ink); }
  .cal-title { margin:0; font:800 24px/1.2 var(--f-num); letter-spacing:-.4px; }
  .todayBtn { margin-top:16px; }

  details > summary { cursor:pointer; font-weight:700; padding:4px 0; list-style:none; display:flex; align-items:center; justify-content:space-between; }
  details > summary::-webkit-details-marker { display:none; }
  details > summary::after { content:"+"; font:500 24px/1 var(--f-num); color:var(--dim); }
  details[open] > summary::after { content:"−"; }
  .seg { display:flex; gap:4px; padding:4px; background:var(--card2); border-radius:18px; }
  .seg button { flex:1; font:700 19px/1 var(--f-num); background:transparent; min-height:46px; border-radius:14px; color:var(--dim); }
  .seg button.on { background:var(--card); color:var(--acc); box-shadow:0 2px 8px rgba(16,24,40,.14), inset 0 0 0 1.5px var(--acc); }

  ul.list { margin:0; padding:0; list-style:none; }
  ul.list li { padding:12px 0; border-bottom:1px solid var(--line); }
  ul.list li:last-child { border-bottom:0; }
  ul.list .k { display:block; font-size:13px; color:var(--dim); }
  .rules { padding-left:22px; } .rules li { padding:10px 0; } .rules .k { color:var(--dim); font-size:14px; }
  .rules li::marker { color:var(--acc); font:700 16px var(--f-num); }
  .orm-row { display:flex; align-items:center; gap:8px; padding:12px 0; border-bottom:1px solid var(--line); }
  .orm-row label { flex:1; min-width:0; font-weight:500; }
  .orm-row input { width:104px; min-height:50px; font:700 21px/1 var(--f-num); text-align:right; padding:0 14px; border-radius:14px; border:1.5px solid transparent; background:var(--card2); color:var(--text); }
  .orm-row input::placeholder { font:500 15px/1 var(--f-body); color:var(--dim); opacity:.8; }   /* '비움' 안내 글자는 작고 연하게 */
  .orm-row input:focus { border-color:var(--acc); background:var(--card); outline:3px solid var(--acc-soft); outline-offset:0; }
  .orm-row .u { width:24px; color:var(--dim); }
  .warm li { display:flex; justify-content:space-between; gap:8px; }
  .warm li.done { color:var(--dim); text-decoration:line-through; }
  .warm li.next { color:var(--acc); font-weight:700; }
  .sets { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .sets span { padding:2px 10px; border-radius:99px; font:600 13px/1.6 var(--f-num); background:var(--card2); }
  .sets .ok { background:var(--ok-soft); color:var(--ok); } .sets .fail { background:var(--bad-soft); color:var(--bad); } .sets .none { background:transparent; border:1px dashed var(--line); color:var(--dim); }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  td, th { padding:8px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }

  @media (max-width:380px) { .big2 button { font-size:19px; } .cal button { min-height:48px; font-size:15px; } .card { padding:18px; } header, main { padding-left:16px; padding-right:16px; } nav { padding-left:16px; padding-right:16px; } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }

  .sheet { position:fixed; inset:0; background:rgba(10,14,22,.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); display:flex; align-items:flex-end; justify-content:center; z-index:20; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom, 0px)); }
  .sheet .box { background:var(--card); border-radius:28px; padding:22px; width:100%; max-width:560px; max-height:85vh; overflow:auto; box-shadow:var(--shadow-hi); }
  .sheet textarea { width:100%; min-height:160px; background:var(--card2); color:var(--text); border:1px solid var(--line); border-radius:14px; padding:12px; font:16px/1.4 ui-monospace, Menlo, monospace; }
  .sheet .row button { flex:1; }
  /* v6 동작 그림 — 색은 모두 토큰(밝은/어두운 화면) · v7: 덤벨 색·쉬는 시간 버튼 */
  :root { --fig:#2f6fed; --fig2:#a8c2f7; --prop:#98a2b3; --prop-bg:#eef1f5; --band:#e8590c; --mv:#12805c; --mat:#f7f8fa; --db:#3d4452; }
  @media (prefers-color-scheme:dark) { :root { --fig:#6ea4ff; --fig2:#34507f; --prop:#5d6878; --prop-bg:#232a35; --band:#ff922b; --mv:#4cd39a; --mat:#1d232c; --db:#c3ccd8; } }
  .figs { display:flex; align-items:flex-start; gap:4px; margin:10px 0 4px; }
  .figs figure { flex:1 1 0; min-width:0; margin:0; }
  .figs.one figure { flex:0 1 62%; margin:0 auto; }
  .figs figcaption { font-size:12.5px; line-height:1.45; color:var(--dim); text-align:center; margin-top:4px; word-break:keep-all; }
  .figs.sm figcaption { font-size:11.5px; }
  .figs .to { color:var(--dim); font-size:13px; flex:none; align-self:center; margin-top:-18px; }
  .card > .figs + * { margin-top:6px; }
  .fig { width:100%; height:auto; display:block; background:var(--card2); border-radius:12px; }
  .fig line, .fig path { stroke-linecap:round; fill:none; }
  .fig .bn, .fig .bt, .fig .hair { stroke:var(--fig); } .fig .bf { stroke:var(--fig2); } .fig .btf, .fig .hd { fill:var(--fig); }
  .fig .floor, .fig .pr line { stroke:var(--prop); }
  .fig .prf { fill:var(--prop-bg); stroke:var(--prop); stroke-width:1.5; }
  .fig .anc { fill:var(--band); } .fig .band, .fig .towel { stroke:var(--band); }
  .fig .mv line { stroke:var(--mv); } .fig .mv path { fill:var(--mv); stroke:none; }
  .fig .mat { fill:var(--mat); stroke:var(--prop); stroke-width:1; stroke-dasharray:3 3; }
  .fig .bgw { fill:var(--prop-bg); } .fig .bgt { fill:var(--prop); font-size:10px; }
  .steps { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .stepc { display:block; width:100%; text-align:left; padding:12px 14px; min-height:0; border-radius:16px; line-height:1.4; }
  .stepc .sl { display:block; font-size:12px; color:var(--dim); font-weight:600; }
  .stepc b { font-size:15px; }
  .stepc.mine { box-shadow:inset 0 0 0 2px var(--acc); }
  .stepc .figs { margin:8px 0 0; }
  .lv { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; }
  .lv button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px 8px; min-height:70px; text-align:center; }
  .lv button b { font-size:16px; } .lv button span { font-size:11.5px; color:var(--dim); line-height:1.35; }
  .lv button:disabled { opacity:.45; }
  .fig .dbh { stroke:var(--db); } .fig .dbp { stroke:var(--db); }
  .rs { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; }
  .rs button { min-height:44px; padding:6px 4px; }
  .rs button.on { box-shadow:inset 0 0 0 2px var(--acc); font-weight:700; }

  [hidden] { display:none !important; }
  .card .row.between > span { min-width:0; flex:1; }
  .card .row.between { flex-wrap:nowrap; }
  .rs.two { grid-template-columns:1fr 1fr; }
</style>
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<header><div class="brand"><span class="logo">홈<b>·</b>트</span><span class="sub">주 3회 홈트</span></div><div id="status"></div></header>
<main id="app"></main>
<nav>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>달력</span></button>
  <button data-tab="etc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg><span>기타</span></button>
</nav>
<input type="file" id="file" accept=".json,application/json" hidden>

<script id="figs">
// ===== 동작 그림(SVG) 엔진 — 관절 위치로 사람 그림을 그린다 =====
// 좌표: 바닥 y=0, 위로 +, 단위는 몸 크기 기준(서 있을 때 키 ≈ 120). 각도: 0=오른쪽, 90=위, -90=아래.
// 팔·다리는 [윗마디 각, 아랫마디 각] 또는 { to:[x,y], b:±1 }(손·발목 위치를 정하면 팔꿈치·무릎을 계산, b=굽는 방향)
// 그림 화면: 가로 200 × 세로 140, 바닥선 y=128. 한 동작 = 그림 1~3장(시작 → 동작).
// v2: 덤벨 소품(dbl) · 팔 짧게 보이기(armS/armSN/armSF) · 몸통 짧게 보이기(trS — 정면에서 숙인 몸)
const FIG = (() => {
  const L = { tr:40, nk:5, hr:8, ua:21, fa:19, th:29, sh:28, ft:9 };
  const W = 200, H = 140, FLOOR = 128;
  const R = d => d * Math.PI / 180;
  const go = (p, a, l) => [p[0] + l * Math.cos(R(a)), p[1] + l * Math.sin(R(a))];

// v6: 동작 그림(FIG·POSES — 조립 때 넣음). 그림 1~3장 + 짧은 설명

    <p style="margin:10px 0 0"><b class="bad-t">피할 것</b> — ${esc(h.avoid)}</p>` : '<p class="dim">설명을 준비 중이에요.</p>'}${tip ? `<p class="dim">💡 ${esc(tip)}</p>` : ''}
    ${isDb ? `<p class="dim">🏋️ 덤벨은 바닥에 내려놓을 때 쪼그려 앉아 조용히 — 떨어뜨리지 않게. 들 때 숨을 참지 말고 내쉬어요.</p>` : ''}${isDb && S.settings.preg ? `<p class="acc-t">임신·출산 후 모드예요. 숙이는 덤벨 동작은 의료진과 상의한 뒤, 숨 참지 말고 가볍게 해요. 배가 볼록 튀어나오거나 불편하면 멈춰요.</p>` : ''}
    <p class="dim">횟수·시간보다 자세가 먼저예요. 날카로운 통증이나 저림이 있으면 바로 멈추고, 계속되면 진료를 받아요. 가구를 쓰는 동작은 밀리거나 푹 꺼지지 않는지 먼저 확인해요. 운동 중 소변이 새거나 아래가 묵직하게 처지는 느낌이 들면 멈추고 전문가와 상담해요. (일반적인 안내)</p><button class="primary" id="howClose">닫기</button>`);
  d.querySelector('#howClose').onclick = closeSheet;
}
function ask(msg, yes, label = '확인') {
  const d = sheet(`<p style="margin-top:0">${esc(msg)}</p><div class="row" style="margin-top:12px"><button id="askNo">취소</button><button class="dangerb" id="askYes">${esc(label)}</button></div>`);
  d.querySelector('#askNo').onclick = closeSheet; d.querySelector('#askYes').onclick = () => { closeSheet(); yes(); };
}
function showBackup(raw) {
  const txt = raw ?? JSON.stringify(S, null, 2);
  const d = sheet(`<h2>${raw ? '못 읽은 기록' : '백업'}</h2><p class="dim">아래 내용을 복사해 메모 등에 붙여 두세요.</p><textarea id="bkOut" readonly>${esc(txt)}</textarea><div class="row" style="margin-top:8px"><button id="bkClose">닫기</button><button class="primary" id="bkCopy" style="width:auto">복사</button></div>`);
  d.querySelector('#bkClose').onclick = closeSheet;
  d.querySelector('#bkCopy').onclick = e => { const ta = d.querySelector('#bkOut'), b = e.currentTarget; const sel = () => { ta.focus(); ta.select(); b.textContent = '선택됨 — 직접 복사'; }; try { navigator.clipboard.writeText(txt).then(() => { b.textContent = '복사했어요'; }, sel); } catch { sel(); } };
}
function applyImport(txt) {
  try { const o = Core.validate(JSON.parse(txt)); ask(`백업을 불러올까요? (운동 기록 ${o.history.length}건) 지금 기록은 바뀝니다.`, () => { S = Core.simplify(o); noSave = false; brokenRaw = null; save(); notice = `✅ 백업을 불러왔어요(기록 ${o.history.length}건).`; render(); }, '불러오기'); }
  catch (e) { notice = `❌ 가져오기 실패: ${esc(e.message)} — 지금 기록은 그대로예요.`; render(); }
}
function showImport() {
  const d = sheet(`<h2>백업 가져오기</h2><textarea id="bkIn" placeholder="백업 내용 붙여넣기"></textarea><div class="row" style="margin-top:8px"><button id="bkFile">파일 고르기</button><button id="bkCancel">취소</button><button class="warnb" id="bkGo">불러오기</button></div>`);
  d.querySelector('#bkCancel').onclick = closeSheet;
  d.querySelector('#bkFile').onclick = () => { closeSheet(); $('#file').click(); };
  d.querySelector('#bkGo').onclick = () => { const t = d.querySelector('#bkIn').value.trim(); if (!t) return; closeSheet(); applyImport(t); };
}

// --- 조작 ---
function stale() { const r = Core.closeStale(S, Date.now()); if (r) { save(); notice = r === 'closed' ? '🗓 6시간 넘게 이어하지 않은 운동은 한 만큼 저장하고 마감했어요.' : ''; } return !!r; }
document.addEventListener('click', e => {
  unlockAudio();
  if (e.target.closest?.('#sndBtn')?.id === 'sndBtn') { muted = !muted; try { localStorage.setItem(KEY + '_mute', muted ? '1' : '0'); } catch {} return paintStatus(); }
  const b = e.target.closest('[data-act],[data-tab]'); if (!b) return;
  if (b.dataset.tab) { tab = b.dataset.tab; notice = ''; return render(); }
  const act = b.dataset.act, now = Date.now();
  if (act === 'done' || act === 'fail') { if (now - lastTapAt < 600) return; lastTapAt = now; }   // v2: [아파요]는 막지 않음
  if (['done', 'fail', 'pain', 'undo', 'restMore', 'endNow'].includes(act) && stale()) return render();
  switch (act) {
    case 'calPrev': case 'calNext': { const [y, m] = (calYm || today().slice(0, 7)).split('-').map(Number), d = new Date(y, m - 1 + (act === 'calNext' ? 1 : -1), 1); calYm = Core.ymd(d).slice(0, 7); return render(); }
    case 'calDay': tab = 'day'; dayDate = b.dataset.date === today() ? null : b.dataset.date; notice = ''; window.scrollTo?.(0, 0); return render();
    case 'goToday': tab = 'day'; dayDate = null; forceNext = false; window.scrollTo?.(0, 0); return render();
    case 'forceNext': forceNext = true; return render();
    case 'back': tab = 'cal'; notice = ''; return render();
    case 'done': case 'fail': {
      holdEnd = null;
      const r = Core.tap(S, act === 'done', today(), now); if (!r) return render(); save();
      notice = r.finished ? '✅ 오늘 운동 끝!' : ''; if (r.finished) { calYm = r.finished.date.slice(0, 7); forceNext = false; }   // v3: 추가 운동을 마쳐도 완료 화면
      return render();
    }
    case 'pain': {
      holdEnd = null;
      const r = Core.pain(S, today(), now); if (!r) return render(); save();
      if (r.finished) forceNext = false;
      notice = (r.finished ? '✅ 오늘 운동 끝! ' : '이 동작은 그만하고 넘어가요(다음엔 한 단계 쉬운 동작). ') + '<b>관절이 아프거나 날카로운 통증이면 오늘은 멈추세요.</b>' + (S.settings.preg ? ' 임신·출산 후 모드예요 — 오늘은 쉬고, 통증이 계속되면 의료진과 상의하세요.' : '');
      render();
      if (S.settings.preg && S.session) ask('임신·출산 후 모드예요. 오늘은 여기서 멈추길 권해요. 지금까지 한 만큼 저장할까요?', () => { const h = Core.endNow(S, Date.now()); save(); notice = h ? '✅ 오늘 운동 끝!' : ''; forceNext = false; render(); }, '오늘은 여기까지');
      return;
    }
    case 'holdStart': { const it = S.session ? S.session.items[Core.current(S.session).i] : Core.plan(S, today()).items[0]; holdEnd = now + it.target * 1000; return render(); }
    case 'holdStop': holdEnd = null; return render();
    case 'skip': if (Core.skipRest(S)) save(); return render();
    case 'restMore': if (Core.restAgain(S, now)) { save(); beepAt = null; } return render();
    case 'undo': if (Core.undo(S, now)) { save(); notice = '방금 누른 것을 취소했어요.'; } else notice = '취소할 것이 없어요.'; return render();
    case 'endNow': return ask('오늘은 여기까지 하고 저장할까요? 다 못 한 동작은 목표가 그대로예요.', () => { const h = Core.endNow(S, Date.now()); save(); notice = h ? '✅ 오늘 운동 끝!' : ''; forceNext = false; render(); }, '저장하고 끝내기');
    case 'cancel': return ask('오늘 운동을 기록 없이 지울까요?', () => { Core.cancel(S); save(); notice = '오늘 운동을 지웠어요.'; render(); }, '지우기');
    case 'layoffYes': { const ch = Core.layoffEase(S, today()); save(); notice = ch && ch.length ? '✅ 목표를 조금 낮췄어요. 천천히 다시 올려요.' : '이미 가장 쉬운 목표라 그대로예요.'; return render(); }
    case 'layoffNo': S.layoffAt = S.history.at(-1)?.date || null; save(); return render();
    case 'setDb': { const on = b.dataset.db === '1'; if (S.settings.db === on) return; if (!Core.setDb(S, on)) { notice = '운동 중에는 바꿀 수 없어요.'; return render(); } save();
      notice = S.settings.db ? '✅ 덤벨 동작으로 바꿨어요. 처음 하는 덤벨 동작은 1단계부터 — 쉬우면 [어렵게], 무거우면 [쉽게]로 맞춰요.' : '맨몸 동작으로 돌아왔어요(맨몸 기록은 그대로예요).'; return render(); }
    case 'rest': if (S.session) { notice = '운동 중에는 바꿀 수 없어요.'; return render(); } if (Core.setRest(S, Number(b.dataset.sec))) { save(); notice = `✅ 쉬는 시간 ${b.dataset.sec}초로 바꿨어요.`; } return render();
    case 'toggleLoud': loud = !loud; try { localStorage.setItem(KEY + '_loud', loud ? '1' : '0'); } catch {} aState = 'none'; unlockAudio(); notice = loud ? '✅ 켰어요 — 아래 [🔔 소리 시험]으로 들리는지 확인해 보세요.' : '껐어요 — 벨소리 스위치가 무음이면 소리가 안 나요(음악과 같이 들을 때 좋아요).'; return render();
    case 'testBeep': if (muted) { notice = '위쪽 🔇 소리 끔을 눌러 소리를 켜 주세요.'; return render(); } setTimeout(beep, 150); return;
    case 'toggleBand': if (S.session) { notice = '운동 중에는 바꿀 수 없어요.'; return render(); } S.settings.band = !S.settings.band; save(); return render();
    case 'togglePreg': if (S.session) { notice = '운동 중에는 바꿀 수 없어요.'; return render(); } S.settings.preg = !S.settings.preg; save(); render();
      if (S.settings.preg) ask('쉬운 단계(1단계·최소 목표)부터 다시 시작할까요? (권장)', () => { for (const id of [...Core.PLAN.A, ...Core.PLAN.B]) { if (!Core.EX[id].dbOnly || S.settings.db) Core.progOf(S, id); } for (const [k, p] of Object.entries(S.prog)) { p.step = 0; p.target = Core.stepsByKey(k)[0].min; p.fails = 0; } save(); notice = '✅ 모든 동작을 1단계부터 시작해요.'; render(); }, '1단계부터');
      return;
    case 'stepUp': case 'stepDown': if (!Core.setStep(S, b.dataset.id, act === 'stepUp' ? 1 : -1)) notice = S.session ? '운동 중에는 바꿀 수 없어요.' : '더 바꿀 단계가 없어요.'; else { save(); notice = ''; } return render();
    case 'how': return showHow(b.dataset.name, b.dataset.id, b.dataset.key);
    case 'level': { const L = Core.LEVELS[b.dataset.lv]; if (!L) return; if (S.session) { notice = '운동 중에는 바꿀 수 없어요.'; return render(); } if (S.settings.preg) return;
      return ask(`모든 동작을 '${L.name}' 수준(${L.desc}, 쉬는 시간 ${L.rest}초)으로 맞출까요? 지금보다 쉬운 단계로 내려가는 동작도 있을 수 있어요. 각 동작은 그 단계의 최소 목표부터 시작하고, 지난 기록은 그대로예요.`, () => { if (Core.setLevel(S, b.dataset.lv)) { save(); notice = `✅ '${L.name}' 수준으로 맞췄어요. 동작마다 [쉽게]/[어렵게]로 더 조정할 수 있어요.`; } render(); }, '맞추기'); }
    case 'export': return showBackup();
    case 'exportBroken': { let raw = brokenRaw; if (!raw) { const k = brokenKeys().sort().at(-1); try { raw = k ? localStorage.getItem(k) : null; } catch {} } return raw ? showBackup(raw) : render(); }
    case 'import': return showImport();
    case 'resetAll': return ask('모든 기록과 단계를 지우고 처음부터 시작할까요? (먼저 백업을 권해요)', () => ask('정말 전체 초기화할까요? 되돌릴 수 없어요.', () => { S = Core.fresh(today()); noSave = false; save(); tab = 'cal'; notice = '처음부터 시작해요.'; render(); }, '초기화'), '계속');
  }
});
document.addEventListener('change', e => { const el = e.target; if (el.id !== 'file' || !el.files?.[0]) return; el.files[0].text().then(t => { el.value = ''; applyImport(t); }, () => { el.value = ''; notice = '❌ 파일을 읽지 못했어요.'; render(); }); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (stale()) {} render(); keepAwake(); } });
load(); if (stale()) {} render();
keepAwake();   // v9: 새로고침으로 이어진 운동도 화면 켜 두기
</script>

</body></html>
